# Портал ИД (id) — production-профиль для backend-vps-1 (single-VPS baseline).
# Собирается и разворачивается через `deploy-id` (deploy/deploy-id.sh), portal-scoped —
# не затрагивает соседние порталы, infra-nginx, Keycloak.
#
# БД — внешний Yandex Managed PostgreSQL, в compose не входит.
# Nginx (infra-nginx) и Keycloak — отдельные инфраструктурные compose-проекты (/opt/infra/*).
# Единственная точка входа — сеть `edge`. Портов наружу этот файл не публикует.
#
# Миграции — отдельный шаг (не из api/worker):
#   docker compose -f deploy/docker-compose.prod.yml -p id run --rm migrate
#
# Auth: production требует AUTH_MODE=oidc + Keycloak. Без OIDC процесс api/worker
# не стартует (dev-stub в production запрещён). См. deploy/README.md.

services:
  id-api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: id-api:${ID_TAG:-latest}
    command: ['node', 'apps/api/dist/server.js']
    env_file: /etc/id/id.env
    environment:
      NODE_ENV: production
      # V8 не видит cgroup: без этой переменной он считает потолок кучи от
      # памяти ХОСТА (7.8 ГиБ) и спокойно растёт мимо mem_limit — вместо
      # давления на сборщик мусора получается OOM-kill.
      NODE_OPTIONS: --max-old-space-size=384
    networks: [edge]
    volumes:
      - /etc/id/root.crt:/etc/id/root.crt:ro
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 1024m
    cpus: 1.0
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health/ready || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Воркер — единственный контейнер портала, который считает: рендер страниц,
  # ONNX-детекция, кропы. На общем VPS (рядом estimat/technic/billhub/keycloak)
  # он обязан быть ограничен со всех сторон, иначе один комплект на 220 страниц
  # уводит хост в swap и роняет соседей — так и произошло (S41).
  id-worker:
    image: id-api:${ID_TAG:-latest}
    command: ['node', 'apps/worker/dist/main.js']
    env_file: /etc/id/id.env
    environment:
      NODE_ENV: production
      # Половина mem_limit: остальное занимает то, что вне кучи V8 и потому
      # этой переменной не ограничивается — буферы libvips, арены ONNX,
      # Buffer'ы картинок для модели.
      NODE_OPTIONS: --max-old-space-size=640
      # Порт служебного /metrics задан здесь, а не в id.env: healthcheck ниже
      # обращается к нему по номеру, и врозь эти две копии уже разъехались —
      # в прод-env переменной не оказалось, сервер метрик не поднимался, и
      # воркер стоял unhealthy, продолжая обрабатывать задачи. Значение из
      # env_file перекрывается этой строкой намеренно: порт назначает деплой.
      WORKER_METRICS_PORT: '9101'
    networks: [edge]
    volumes:
      - /etc/id/root.crt:/etc/id/root.crt:ro
    restart: unless-stopped
    mem_limit: 1536m
    memswap_limit: 1792m
    # Полтора ядра из двух: конвейеру нужен запас, но не вся машина.
    cpus: 1.5
    # При конкуренции за процессор соседи выигрывают (умолчание 1024). Фоновая
    # разметка обязана уступать чужому веб-интерфейсу, а не наоборот.
    cpu_shares: 512
    # При нехватке памяти НА ХОСТЕ ядро выбирает жертву по этому счёту. Воркер
    # переживает своё убийство лучше всех: задачи вернутся по истечении аренды.
    oom_score_adj: 400
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    # Согласовано с WORKER_SHUTDOWN_TIMEOUT_MS (id.env): воркеру нужно уложиться
    # в этот срок с запасом на закрытие журнала и пула. Прежние 120s были
    # фикцией — код выходил через 8 секунд, ничего о них не зная.
    stop_grace_period: 45s
    # Проверяем служебный /metrics (WORKER_METRICS_PORT задан выше, в этом же
    # сервисе): у воркера нет ни одного другого порта, а зависший процесс иначе
    # неотличим от занятого.
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9101/metrics >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  id-web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      # Метка выкатки вшивается в бандл на сборке (плашка «доступна новая
      # версия» и `buildId` в отчётах об ошибках). Значение подставляет
      # deploy-id.sh; пустое значение здесь безопасно — фронт трактует его как
      # «сборка не названа» и проверку версий не ведёт.
      args:
        APP_RELEASE: ${APP_RELEASE:-}
    image: id-web:${ID_TAG:-latest}
    restart: unless-stopped
    networks: [edge]
    mem_limit: 64m
    memswap_limit: 128m
    pids_limit: 128
    cap_drop: [SYS_ADMIN, SYS_PTRACE, NET_RAW, MKNOD, AUDIT_WRITE]
    security_opt: ['no-new-privileges:true']

  # Разовый накат SQL-миграций. DATABASE_URL здесь ПЕРЕОПРЕДЕЛЁН из
  # /etc/id/id-migrate.env (MIGRATE_DATABASE_URL) — deploy-id.sh подставляет значение.
  # На этапе 1 допустима та же роль fin_id, что и в runtime.
  migrate:
    image: id-api:${ID_TAG:-latest}
    command: ['node', 'tools/migrator/dist/cli.js']
    profiles: ['tools']
    env_file: /etc/id/id.env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${MIGRATE_DATABASE_URL:-}
    networks: [edge]
    volumes:
      - /etc/id/root.crt:/etc/id/root.crt:ro
    restart: 'no'
    mem_limit: 256m
    memswap_limit: 384m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']

networks:
  edge:
    external: true
