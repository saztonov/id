# Заготовка CI. Раннера пока нет — файл коммитится готовым к включению.
#
# Ключевое отличие от локальных гейтов: здесь поднимается НАСТОЯЩАЯ PostgreSQL,
# поэтому выполняются тесты конкурентности и реальное применение миграций,
# которые на pglite пропускаются (см. docs/ADR/0002).
name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: id_portal_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/id_portal_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Обязательные расширения PostgreSQL
        # Стандарт запрещает CREATE EXTENSION в миграциях приложения:
        # расширения включаются заранее, отдельным шагом.
        run: |
          PGPASSWORD=ci psql -h localhost -U ci -d id_portal_test \
            -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto;' \
            -c 'CREATE EXTENSION IF NOT EXISTS citext;' \
            -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;'

      - name: Типы
        run: pnpm -r typecheck

      - name: Линт
        run: pnpm -r lint

      - name: Форматирование
        run: pnpm format:check

      - name: Персональные данные корпуса не попали в репозиторий
        run: pnpm pii:scan

      # Сборка идёт до тестов: часть тестов потребляет собранные воркспейс-пакеты
      # (тест seed прогоняет SQL через @id/db-harness). Обратный порядок дал бы
      # падение в CI при зелёном прогоне локально.
      - name: Сборка
        run: pnpm -r build

      - name: Тесты
        run: pnpm -r test

      - name: Фикстуры детерминированы
        run: |
          pnpm fixtures:generate
          git diff --exit-code tools/fixtures/pdf
