# Раздача SPA внутри контейнера id-web. Внешний ingress (infra-nginx) проксирует сюда
# только "/" — здесь нет ни TLS, ни маршрутизации по домену, только статика.
#
# ## Про `.mjs` и тип содержимого
#
# Воркер pdf.js собирается отдельным файлом с расширением `.mjs`
# (`pdfjs-dist/build/pdf.worker.min.mjs?url` в `features/markup/pdf/pdfjs.ts`) и
# грузится браузером как ES-модуль. Расширения `.mjs` нет в `mime.types` образа
# nginx, поэтому файл уезжал с `default_type` — `application/octet-stream`, — а
# для модульного скрипта браузер обязан такой ответ отвергнуть (strict MIME type
# checking по спецификации HTML). Ingress вдобавок ставит
# `X-Content-Type-Options: nosniff`, и это правильно: угадывать тип он не должен.
#
# Наблюдалось как «Страница не отрисована. Setting up fake worker failed» на
# вкладке разметки: pdf.js ловит отказ загрузки воркера, откатывается на
# «фальшивый» воркер в главном потоке, и тот падает следом.
#
# Тип задаётся через `default_type` в location, а НЕ блоком `types { … }`:
# `types` на уровне server или location ЗАМЕНЯЕТ унаследованную таблицу целиком,
# и одна добавленная строка обнулила бы все остальные типы — css, png, json
# поехали бы тем же octet-stream. `default_type` же участвует только там, где
# расширение в таблице не нашлось, поэтому на nginx, который `.mjs` уже знает,
# правило просто не сработает и ничего не сломает.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Регулярное выражение выигрывает у префиксного `/assets/`, поэтому заголовки
    # кэширования повторены здесь: воркер лежит в том же `/assets/` и обязан
    # кэшироваться так же — имя у него с хэшем содержимого.
    location ~ \.mjs$ {
        default_type text/javascript;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
