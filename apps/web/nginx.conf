# Раздача SPA внутри контейнера id-web. Внешний ingress (infra-nginx) проксирует сюда
# только "/" — здесь нет ни TLS, ни маршрутизации по домену, только статика.
#
# ## Про `.mjs` и тип содержимого
#
# Воркер pdf.js собирается отдельным файлом с расширением `.mjs`
# (`pdfjs-dist/build/pdf.worker.min.mjs?url` в `features/markup/pdf/pdfjs.ts`) и
# грузится браузером как ES-модуль. Расширения `.mjs` нет в `mime.types` образа
# nginx, поэтому файл уезжал с `default_type` — `application/octet-stream`, — а
# для модульного скрипта браузер обязан такой ответ отвергнуть (strict MIME type
# checking по спецификации HTML). Ingress вдобавок ставит
# `X-Content-Type-Options: nosniff`, и это правильно: угадывать тип он не должен.
#
# Наблюдалось как «Страница не отрисована. Setting up fake worker failed» на
# вкладке разметки: pdf.js ловит отказ загрузки воркера, откатывается на
# «фальшивый» воркер в главном потоке, и тот падает следом.
#
# Тип задаётся через `default_type` в location, а НЕ блоком `types { … }`:
# `types` на уровне server или location ЗАМЕНЯЕТ унаследованную таблицу целиком,
# и одна добавленная строка обнулила бы все остальные типы — css, png, json
# поехали бы тем же octet-stream. `default_type` же участвует только там, где
# расширение в таблице не нашлось, поэтому на nginx, который `.mjs` уже знает,
# правило просто не сработает и ничего не сломает.
#
# ## Про `/pdfjs/` и `.wasm`
#
# Каталог кладёт в сборку плагин `id-pdfjs-assets` (`apps/web/vite.config.ts`):
# шрифты, таблицы CMap, wasm-декодеры и ICC-профиль, которые pdf.js догружает
# сам. Раздаётся он ПРЕФИКСНЫМ location без `try_files` — и это существенно:
# в `location /` отсутствующий файл подменяется страницей `index.html`, то есть
# pdf.js получил бы HTML вместо `openjpeg.wasm` и упал бы с невнятной ошибкой
# разбора вместо честного 404. Ровно та же ловушка «не тот тип содержимого»,
# что уже случилась выше с `.mjs`, только ещё менее читаемая.
#
# `.wasm` вынесен отдельным регулярным location по той же причине и с тем же
# приёмом (`default_type`, не `types`): браузер компилирует модуль потоком
# только при `application/wasm`, а расширение есть в `mime.types` не всех
# версий образа. Заголовки кэширования в нём повторены намеренно —
# регулярный location выигрывает у префиксного и не наследует его директив.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Регулярное выражение выигрывает у префиксного `/assets/`, поэтому заголовки
    # кэширования повторены здесь: воркер лежит в том же `/assets/` и обязан
    # кэшироваться так же — имя у него с хэшем содержимого.
    location ~ \.mjs$ {
        default_type text/javascript;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~ \.wasm$ {
        default_type application/wasm;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Ресурсы pdf.js. Имена файлов заданы самой библиотекой и хэша не несут,
    # поэтому `immutable` здесь опирается на версию пакета: обновление
    # `pdfjs-dist` меняет и содержимое, и — через bundle — код, который его
    # запрашивает, а до тех пор файлы неизменны.
    location /pdfjs/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Метка выкатки для сверки версий во вкладке (`src/app/AppUpdateBanner.tsx`).
    # Кэшировать её нельзя вовсе: закэшированный ответ — это ровно та сборка, на
    # которой вкладка уже работает, то есть проверка всегда отвечала бы «всё
    # свежее».
    #
    # Точный location без `try_files`: в `location /` отсутствующий файл
    # подменяется страницей `index.html`, и вкладка разбирала бы HTML как JSON
    # вместо честного 404 — та же ловушка «не тот тип содержимого», что описана
    # выше про `.mjs` и `/pdfjs/`.
    location = /version.json {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
