# Раздача SPA внутри контейнера id-web. Внешний ingress (infra-nginx) проксирует сюда
# только "/" — здесь нет ни TLS, ни маршрутизации по домену, только статика.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
